name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
      
      - name: Run build
        run: npm run build

  PushDocker:
    name: Push Docker
    runs-on: ubuntu-latest
    needs: Deploy   # <- ensures this runs after Deploy
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/526177751362/locations/global/workloadIdentityPools/notely-pool/providers/notely-provider'
          service_account: 'cloud-run-deployer@notely-486922.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 363.0.0'

      - name: Verify gcloud
        run: gcloud info     

      - name: Build and push Docker image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-486922/notely-ar-repo/notely:v1.1 .